{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Watchlist Management</h1>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Ticker</button>
</div>

<div class="grid-2">
    <!-- Ticker List -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">Current Watchlist</span>
            <span class="text-muted text-sm" id="tickerCount"></span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Name</th>
                        <th>Notes</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="watchlistTable">
                    <tr><td colspan="4" class="text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Quick Stats -->
    <div>
        <div class="card">
            <div class="card-header"><span class="card-title">📊 Watchlist Stats</span></div>
            <div class="text-sm">
                <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                    <span class="text-muted">Total Tickers</span>
                    <strong id="statTickers">—</strong>
                </div>
                <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                    <span class="text-muted">Last Updated</span>
                    <strong id="statUpdated">—</strong>
                </div>
                <div class="flex-between" style="padding:8px 0;">
                    <span class="text-muted">Scoring Weights</span>
                    <a href="/settings" style="color:var(--blue);font-size:13px;">Manage in Settings →</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let watchlistData = null;

function loadWatchlist() {
    API.watchlist().then(wl => {
        watchlistData = wl;
        const tickers = wl?.tickers || [];
        document.getElementById('tickerCount').textContent = tickers.length + ' tickers';
        document.getElementById('statTickers').textContent = tickers.length;
        document.getElementById('statUpdated').textContent = wl?.settings?.updated_at ? wl.settings.updated_at.slice(0,10) : '—';
        const tbody = document.getElementById('watchlistTable');
        if (tickers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-muted">No tickers in watchlist</td></tr>';
        } else {
            tbody.innerHTML = tickers.map(t => `
                <tr>
                    <td><strong>${t.symbol}</strong></td>
                    <td>${t.name || '—'}</td>
                    <td class="text-muted">${t.notes || '—'}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="removeTicker('${t.symbol}')">Remove</button></td>
                </tr>
            `).join('');
        }
    }).catch(e => {
        console.error('Watchlist load error:', e);
        showToast('Error loading watchlist', 'error');
    });
}

function openAddModal() {
    openModal(`
        <div class="modal-header">
            <h3>Add Ticker</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="form-group">
            <label>Symbol</label>
            <input type="text" class="form-control" id="addSymbol" placeholder="e.g. NVDA" style="text-transform:uppercase;">
        </div>
        <div class="form-group">
            <label>Name (optional)</label>
            <input type="text" class="form-control" id="addName" placeholder="e.g. NVIDIA Corp">
        </div>
        <div class="form-group">
            <label>Notes (optional)</label>
            <input type="text" class="form-control" id="addNotes" placeholder="e.g. AI/GPU leader">
        </div>
        <div class="flex gap-2 mt-2">
            <button class="btn btn-primary" onclick="addTicker()">Add</button>
            <button class="btn" onclick="closeModal()">Cancel</button>
        </div>
    `);
}

function addTicker() {
    const symbol = document.getElementById('addSymbol').value.trim().toUpperCase();
    const name = document.getElementById('addName').value.trim();
    const notes = document.getElementById('addNotes').value.trim();
    if (!symbol) return;
    API.addWatchlist({ symbol, name: name || symbol, notes }).then(result => {
        if (result.error) {
            showToast(result.error, 'error');
        } else {
            closeModal();
            showToast('Added ' + symbol, 'success');
            loadWatchlist();
        }
    }).catch(e => showToast('Add failed', 'error'));
}

function removeTicker(symbol) {
    if (!confirm('Remove ' + symbol + ' from watchlist?')) return;
    API.removeWatchlist({ symbol }).then(() => {
        showToast('Removed ' + symbol, 'info');
        loadWatchlist();
    }).catch(e => showToast('Remove failed', 'error'));
}

loadWatchlist();
</script>
{% endblock %}
